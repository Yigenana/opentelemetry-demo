# extra settings to be merged into OpenTelemetry Collector configuration
# do not delete this file

## Example configuration for sending data to your own OTLP HTTP backend
## Note: the spanmetrics exporter must be included in the exporters array
## if overriding the traces pipeline.
##
#  exporters:
#    otlphttp/example:
#      endpoint: <your-endpoint-url>
#
#  service:
#    pipelines:
#      traces:
#        exporters: [spanmetrics, otlphttp/example]
extensions:
  datadog/extension:
    api:
      site: ${env:DD_SITE_PARAMETER}
      key: ${env:DD_API_KEY}
    http:
      endpoint: "localhost:9875"
      path: "/metadata"

exporters:
  datadog:
    traces:
      compute_stats_by_span_kind: true
      trace_buffer: 500
    hostname: "otel-collector-docker"
    api:
      site: ${env:DD_SITE_PARAMETER}
      key: ${env:DD_API_KEY}

processors:
  resource:
    attributes:
      - key: deployment.environment
        value: "otel"
        action: upsert
  tail_sampling:
    decision_wait: 10s
    num_traces: 100
    expected_new_traces_per_sec: 10
    policies: [
        {
          # Rule 1: use always_sample policy for services that don't belong to team_a and are not ready to use tail sampling
          name: backwards-compatibility-policy,
          type: and,
          and:
            {
              and_sub_policy:
                [
                  {
                    name: services-using-tail_sampling-policy,
                    type: string_attribute,
                    string_attribute:
                      {
                        key: service.name,
                        values:
                          [
                            accounting,
                            checkout,
                            currency
                          ],
                        invert_match: true,
                      },
                  },
                  { name: sample-all-policy, type: always_sample },
                ],
            },
        },
        # BEGIN: policies for team_a
        {
          # Rule 2: low sampling for readiness/liveness probes
          name: team_a-probe,
          type: and,
          and:
            {
              and_sub_policy:
                [
                  {
                    # filter by service name
                    name: service-name-policy,
                    type: string_attribute,
                    string_attribute:
                      {
                        key: service.name,
                        values: [ad, email, recommendation, image-provider],
                      },
                  },
                  {
                    # filter by route
                    name: route-live-ready-policy,
                    type: string_attribute,
                    string_attribute:
                      {
                        key: http.route,
                        values: [/status],
                        enabled_regex_matching: true,
                      },
                  },
                  {
                    # apply probabilistic sampling
                    name: probabilistic-policy,
                    type: probabilistic,
                    probabilistic: { sampling_percentage: 0.1 },
                  },
                ],
            },
        },
        {
          # Rule 5: always sample if there is an error
          name: team_a-status-policy,
          type: and,
          and:
            {
              and_sub_policy:
                [
                  {
                    name: service-name-policy,
                    type: string_attribute,
                    string_attribute:
                      {
                        key: service.name,
                        values:
                          [
                            ad, 
                            email, 
                            recommendation, 
                            image-provider
                          ],
                      },
                  },
                  {
                    name: trace-status-policy,
                    type: status_code,
                    status_code: { status_codes: [ERROR] },
                  },
                ],
            },
        },
        {
          # Rule 6:
          # always sample if the force_sample attribute is set to true
          name: team_a-force-sample,
          type: boolean_attribute,
          boolean_attribute: { key: app.force_sample, value: true },
        },
        {
          # Rule 7:
          # never sample if the do_not_sample attribute is set to true
          name: do-not-sample,
          type: drop,
          drop: {
            drop_sub_policy:
              [
                {
                  name: team_a-do-not-sample,
                  type: boolean_attribute,
                  boolean_attribute: { key: app.do_not_sample, value: true }
                }
              ]
          }
        }
        # END: policies for team_a
      ]

connectors:
  datadog/connector:
    traces:
      compute_stats_by_span_kind: true

service:
  extensions: [datadog/extension]
  pipelines:
    traces:
      processors: [resource, tail_sampling, resourcedetection, memory_limiter, transform, batch]
      exporters: [otlp, debug, spanmetrics, datadog, datadog/connector]
    metrics:
      receivers: [datadog/connector, docker_stats, httpcheck/frontend-proxy, hostmetrics, nginx, otlp, postgresql, redis, spanmetrics]
      processors: [resource, resourcedetection, memory_limiter, transform, batch]
      exporters: [otlphttp/prometheus, debug, datadog]
    logs:
      processors: [resource, resourcedetection, memory_limiter, transform, batch]
      exporters: [opensearch, debug, datadog]
